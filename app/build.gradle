plugins {
    id 'com.android.application' version '8.7.3'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
}

android {
    namespace 'org.rigctld.android'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.rigctld.android'
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName '0.1-dev'
        buildConfigField 'String', 'HAMLIB_REVISION',
            '"' + rootProject.file('native/hamlib-version').text.trim() + '"'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path '../native/CMakeLists.txt'
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.0'
}
