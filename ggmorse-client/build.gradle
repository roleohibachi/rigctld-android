plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'org.rigctld.ggmorse'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.rigctld.ggmorse'
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName '0.1-dev'
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(rootProject.file('.work/ggmorse-notices'))
}
